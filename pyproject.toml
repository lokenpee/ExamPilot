[project]
name = "exampilot"
version = "0.3.0"
description = "Evidence-grounded exam authoring with two agents and a real MCP server"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3",
  "httpx>=0.27,<1", "mcp>=1.12,<2", "python-multipart>=0.0.20",
  "pypdf>=5,<7", "python-pptx>=1,<2", "python-docx>=1,<2",
  "jieba>=0.42", "rank-bm25>=0.2", "keyring>=25,<26",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

